send_message:
  name: Send message
  description: Send a request to Inu, for example "task Wash to fluff abhaken", and receive its result. Currently supports completing one task.
  fields:
    message:
      name: Message
      required: true
      example: task Wash to fluff abhaken
      selector:
        text:
          multiline: true
    config_entry_id:
      name: Inu account
      description: Choose an account if you connected more than one.
      selector:
        config_entry:
          integration: inu
