complete_task:
  name: Complete task
  description: Enter the full task name from Inu to check it off.
  fields:
    task_name:
      name: Task name
      description: Enter the full title as it appears in Inu.
      required: true
      example: Water the plants
      selector:
        text:
    config_entry_id:
      name: Inu account
      description: Choose an account if you connected more than one.
      selector:
        config_entry:
          integration: inu

send_message:
  name: Text command (advanced)
  description: For existing automations and free-form commands. For a known name, choose Complete task.
  fields:
    message:
      name: Command
      required: true
      example: "complete: Water the plants"
      selector:
        text:
          multiline: true
    config_entry_id:
      name: Inu account
      description: Choose an account if you connected more than one.
      selector:
        config_entry:
          integration: inu

send_notification:
  name: Send notification
  description: Send a note to your Inu inbox. Your PC can show it when notifications are enabled.
  fields:
    message:
      name: Message
      required: true
      example: Open a window
      selector:
        text:
          multiline: true
    config_entry_id:
      name: Inu account
      selector:
        config_entry:
          integration: inu
